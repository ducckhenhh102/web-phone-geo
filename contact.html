<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="static">
    <header class="site-header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo"><img src="images/logo.svg" alt="TechStore"></a>
            <button id="menu-toggle" class="menu-toggle">☰</button>
            <nav class="main-nav" id="main-nav">
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Sản phẩm</a>
                <a href="brands.html">Hãng</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">Giới thiệu</a>
                <a href="contact.html">Liên hệ</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="text-content">
            <h1>Liên hệ với chúng tôi</h1>
            <form style="max-width: 600px; margin-top:2rem;">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" placeholder="Nhập tên của bạn">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label>Nội dung</label>
                    <textarea rows="5" placeholder="Bạn cần hỗ trợ gì?"></textarea>
                </div>
                <button type="button" class="btn-submit">Gửi liên hệ</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>&copy; 2026 TechStore. Tối ưu GEO.</p></div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
